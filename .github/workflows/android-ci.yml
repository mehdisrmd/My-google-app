name: Build & Publish Split Android APKs by CPU to GitHub Releases

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Release X Blocker Split APKs (ARM64 / ARMv7a / x86_64 / Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare Signing Keystore & Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Split APKs by CPU Architecture (arm64-v8a, armeabi-v7a, x86_64, universal)
        run: |
          gradle :app:assembleDebug -PsplitAbi=true --stacktrace
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/X-Blocker-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk release-apks/X-Blocker-armeabi-v7a.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-x86_64-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-x86_64-debug.apk release-apks/X-Blocker-x86_64.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-x86-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-x86-debug.apk release-apks/X-Blocker-x86.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk release-apks/X-Blocker-universal.apk
            cp app/build/outputs/apk/debug/app-universal-debug.apk release-apks/X-Blocker.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/X-Blocker-universal.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/X-Blocker.apk
          fi
          ls -lh release-apks/

      - name: Upload Split X Blocker APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Blocker-Split-APKs
          path: release-apks/*.apk

      - name: Publish Split CPU APKs to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: "X Blocker v0.4.${{ github.run_number }} (Split CPU APKs: ARM64 / ARMv7a / Universal)"
          body: |
            ### X Blocker Android Release (v0.4.${{ github.run_number }})
            - **Developer Telegram:** [@mehdisrmd](https://t.me/mehdisrmd)
            - **CPU-Specific APK Downloads (Choose your device architecture):**
              - **`X-Blocker-arm64-v8a.apk`** — Modern 64-bit Android phones (`ARM64 / arm64-v8a`, recommended for most phones)
              - **`X-Blocker-armeabi-v7a.apk`** — Older 32-bit Android phones (`ARMv7a / armeabi-v7a`)
              - **`X-Blocker-x86_64.apk`** — Android Emulators, Chromebooks & x86_64 tablets
              - **`X-Blocker-universal.apk`** — Universal APK supporting all CPU architectures
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
